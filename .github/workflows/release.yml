# Builds EDGEdeck and, when asked, publishes a release.
#
#   Run workflow (Actions tab)                  checks, builds and tests, then keeps the .vsix and the
#                                               Nexus zip as the run's artifact; nothing is published
#   Run workflow, "Make a release" ticked       also publishes v<package.json version> and tags this
#                                               commit with it; stops first if that tag exists (raise
#                                               the version), if it is not run on main, or if
#                                               CHANGELOG.md has no section for it
#   npm run release                             the same as ticking the box, from a terminal
#   ... and "Update Nexus Mods" ticked          also, after the GitHub release, uploads the Nexus zip
#                                               to the page as the main file's new version (the old
#                                               one archived, Mod Manager Download off: an extension,
#                                               not a game mod), adds its changelog and pushes
#                                               nexus/description.bbcode (tools/nexus/nexus.mjs,
#                                               copied from REDnode; NEXUS_KEY). It checks the page
#                                               first and stops before building if nexus/nexus.json
#                                               names no page, or if the description changed on Nexus
#                                               since the last pull (node tools/nexus/nexus.mjs pull,
#                                               merge, commit, run again). If the upload fails after
#                                               the GitHub release, run tools/nexus/nexus.mjs release
#                                               on the dev PC with the release's zip: it skips what is
#                                               already done.
#
# A release publishes to the VS Code Marketplace (VSCE_PAT) and Open VSX (OVSX_PAT, skipped while that
# secret is not set), publishes the MCP server and CLI to npm as @edgemodders/edgedeck-mcp at the same
# version (NPM_TOKEN), and makes the GitHub release with the .vsix, the Nexus Mods zip
# (scripts/nexus-zip.mjs) and the version's CHANGELOG.md section as notes (scripts/release-notes.mjs).
# The tokens are Edgemodders organisation secrets (NEXUS_KEY shared with REDnode's, EDGEmat's and
# EDGEchat's workflows). The tag is made by the GitHub release step, so a run that fails partway can
# be run again.
#
# Release gate: make a release only after every hand test of the changes since the last release has
# passed (docs/testing.md, "Waiting for a hand test"). Untested or failed means no release.
name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (publishes and tags this commit v<version>). Only after every hand test has passed
        type: boolean
        default: false
      nexus:
        description: Update Nexus Mods (with Make a release) - upload the Nexus zip, its changelog and the page's description
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RELEASE: ${{ inputs.release == true }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags: the Nexus check compares with the previous release's description

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: The version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${RELEASE}" = "true" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Releases are made from main, not ${GITHUB_REF_NAME}"
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" --silent >/dev/null 2>&1; then
              echo "::error::v${version} is already released. Raise the version in package.json first."
              exit 1
            fi
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=v${version}" >> "$GITHUB_ENV"

      # Before anything is built or published: no CHANGELOG.md section for the version stops a release here.
      - name: Release notes from CHANGELOG.md
        if: env.RELEASE == 'true'
        run: |
          node scripts/release-notes.mjs "${VERSION}" --out "${RUNNER_TEMP}/notes.md"
          node scripts/release-notes.mjs "${VERSION}" --nexus --out "${RUNNER_TEMP}/nexus-notes.txt"

      - name: Nexus Mods can take this release
        if: env.RELEASE == 'true' && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          if [ -z "$(node -p "require('./nexus/nexus.json').page ?? ''")" ]; then
            echo "::error::nexus/nexus.json names no page yet. Put the page's number in it as \"page\", then run node tools/nexus/nexus.mjs pull (nexus/README.md)."
            exit 1
          fi
          node tools/nexus/nexus.mjs check --version "${VERSION}"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke

      - name: Package
        run: npx vsce package --no-dependencies --target win32-x64 --readme-path docs/marketplace.md --out "dist/edgedeck-${VERSION}.vsix"

      - name: Nexus zip
        run: node scripts/nexus-zip.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: EDGEdeck
          path: |
            dist/edgedeck-*.vsix
            dist/EDGEdeck-*-nexus.zip
          if-no-files-found: error

      - name: VS Code Marketplace
        if: env.RELEASE == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # --skip-duplicate: a re-run of a release that got partway does not fail on what is already out.
        run: npx vsce publish --packagePath "dist/edgedeck-${VERSION}.vsix" --skip-duplicate

      - name: Open VSX
        if: env.RELEASE == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::warning::OVSX_PAT is not set; not published to Open VSX"
            exit 0
          fi
          npx ovsx publish "dist/edgedeck-${VERSION}.vsix" --pat "${OVSX_PAT}" --skip-duplicate

      - name: npm (@edgemodders/edgedeck-mcp)
        if: env.RELEASE == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not set; the MCP package is not published"
            exit 0
          fi
          node scripts/npm-package.mjs
          if npm view "@edgemodders/edgedeck-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@edgemodders/edgedeck-mcp ${VERSION} is already on npm"
            exit 0
          fi
          # ./ matters: "dist/npm" alone reads as a GitHub repository.
          npm publish ./dist/npm --provenance --access public

      # Makes the tag too (--target: this commit).
      - name: GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; adding the Nexus zip if it is missing"
            gh release upload "${TAG}" "dist/EDGEdeck-${VERSION}-nexus.zip" --clobber
            exit 0
          fi
          gh release create "${TAG}" "dist/edgedeck-${VERSION}.vsix" "dist/EDGEdeck-${VERSION}-nexus.zip" --target "${GITHUB_SHA}" --title "EDGEdeck ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"

      # Skips what is already on Nexus, so a re-run is safe.
      - name: Nexus Mods
        if: env.RELEASE == 'true' && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: node tools/nexus/nexus.mjs release --version "${VERSION}" --zip "dist/EDGEdeck-${VERSION}-nexus.zip" --notes "${RUNNER_TEMP}/nexus-notes.txt"
